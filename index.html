<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>অ্যাডমিন — AI BAZAR</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07070c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Hind Siliguri"', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', '"Hind Siliguri"', 'sans-serif'],
            },
            colors: {
              ink: '#07070c',
              panel: '#0f0f18',
              gold: { 300: '#fbe3a1', 400: '#f5c451', 500: '#e3a92b' },
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-ink font-sans text-zinc-200 antialiased">
    <header class="border-b border-white/5">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-4">
        <a href="/" class="flex items-center gap-2">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-gold-300 to-gold-500 font-display text-lg font-bold text-ink">A</span>
          <span class="font-display text-xl font-bold text-white">AI <span class="text-gold-400">BAZAR</span></span>
          <span class="ml-2 rounded-full bg-white/5 px-3 py-0.5 text-xs text-zinc-400">অ্যাডমিন</span>
        </a>
        <a href="/" class="text-sm text-zinc-400 hover:text-white">← হোমপেজে যান</a>
      </div>
    </header>

    <main class="mx-auto grid max-w-5xl gap-8 px-5 py-12 lg:grid-cols-5">
      <section class="lg:col-span-3">
        <h1 class="text-3xl font-bold text-white">নতুন প্রোডাক্ট যোগ করুন</h1>
        <p class="mt-2 text-zinc-400">এখানে যোগ করা টুল সাথে সাথে হোমপেজে দেখাবে।</p>

        <form id="product-form" class="mt-8 space-y-5 rounded-3xl border border-white/5 bg-panel p-6 sm:p-8">
          <div>
            <label for="name" class="mb-2 block text-sm font-medium text-zinc-300">টুলের নাম</label>
            <input id="name" name="name" required placeholder="যেমন: চ্যাটবট AI" class="w-full rounded-xl border border-white/10 bg-ink px-4 py-3 text-white placeholder-zinc-600 outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-400/20" />
          </div>
          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="price" class="mb-2 block text-sm font-medium text-zinc-300">মূল্য (টাকা)</label>
              <div class="relative">
                <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gold-400">৳</span>
                <input id="price" name="price" type="number" min="0" step="1" required placeholder="৪৯৯" class="w-full rounded-xl border border-white/10 bg-ink py-3 pl-9 pr-4 text-white placeholder-zinc-600 outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-400/20" />
              </div>
            </div>
            <div>
              <label for="category" class="mb-2 block text-sm font-medium text-zinc-300">ক্যাটাগরি</label>
              <input id="category" name="category" list="category-list" required placeholder="যেমন: ব্যবসা" class="w-full rounded-xl border border-white/10 bg-ink px-4 py-3 text-white placeholder-zinc-600 outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-400/20" />
              <datalist id="category-list">
                <option value="ব্যবসা"></option>
                <option value="মার্কেটিং"></option>
                <option value="ভিডিও"></option>
                <option value="ডিজাইন"></option>
                <option value="সাপোর্ট"></option>
                <option value="শিক্ষা"></option>
              </datalist>
            </div>
          </div>
          <div>
            <label for="description" class="mb-2 block text-sm font-medium text-zinc-300">বিবরণ</label>
            <textarea id="description" name="description" rows="4" required placeholder="টুলটি কী কাজ করে সংক্ষেপে লিখুন" class="w-full rounded-xl border border-white/10 bg-ink px-4 py-3 text-white placeholder-zinc-600 outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-400/20"></textarea>
          </div>
          <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-gold-300 to-gold-500 px-6 py-3.5 font-semibold text-ink hover:brightness-110">প্রোডাক্ট যোগ করুন</button>
          <p id="status" class="hidden rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-300" role="status"></p>
        </form>
      </section>

      <aside class="lg:col-span-2">
        <h2 class="text-xl font-bold text-white">আপনার যোগ করা প্রোডাক্ট</h2>
        <p class="mt-1 text-sm text-zinc-500">ডিফল্ট ৬টি টুলের পাশাপাশি</p>
        <ul id="custom-list" class="mt-5 space-y-3"></ul>
      </aside>
    </main>

    <script src="/products.js"></script>
    <script>
      const form = document.getElementById('product-form');
      const status = document.getElementById('status');
      const list = document.getElementById('custom-list');

      function renderList() {
        const items = aibazarLoadCustom();
        if (!items.length) {
          list.innerHTML = '<li class="rounded-2xl border border-dashed border-white/10 p-6 text-center text-sm text-zinc-500">এখনো কোনো প্রোডাক্ট যোগ করা হয়নি</li>';
          return;
        }
        list.innerHTML = items
          .map(
            (p) => `
          <li class="flex items-start justify-between gap-3 rounded-2xl border border-white/5 bg-panel p-4">
            <div class="min-w-0">
              <p class="truncate font-semibold text-white">${aibazarEscape(p.name)}</p>
              <p class="text-sm text-zinc-500">${aibazarEscape(p.category)} · <span class="text-gold-400">${aibazarTaka(p.price)}</span></p>
            </div>
            <button type="button" data-delete="${aibazarEscape(p.id)}" class="shrink-0 rounded-lg px-2.5 py-1 text-sm text-red-400 hover:bg-red-500/10">মুছুন</button>
          </li>`
          )
          .join('');
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const product = aibazarAddProduct({
          name: data.name.trim(),
          price: data.price,
          category: data.category.trim(),
          description: data.description.trim(),
        });
        form.reset();
        status.textContent = `✓ "${product.name}" সফলভাবে যোগ হয়েছে। হোমপেজে দেখুন।`;
        status.classList.remove('hidden');
        renderList();
      });

      list.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-delete]');
        if (!btn || !confirm('এই প্রোডাক্টটি মুছে ফেলবেন?')) return;
        aibazarDeleteProduct(btn.dataset.delete);
        renderList();
      });

      renderList();
    </script>
  </body>
</html>
